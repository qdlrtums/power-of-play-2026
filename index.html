<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Power of Play — designs</title>
<meta name="description" content="Design directions for the Power of Play site. Pick one and click straight in.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..700,0..100,0..1&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@300..700&display=swap" rel="stylesheet">
<style>
  /* Deliberately plain — this page must not flatter the designs it links to. */
  :root {
    --ground: oklch(97.5% 0.008 148);
    --surface: oklch(99.5% 0.003 148);
    --ink: oklch(18% 0.02 148);
    --ink-muted: oklch(48% 0.02 148);
    --line: oklch(88% 0.018 148);
    --accent: oklch(42% 0.09 148);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ground: oklch(15% 0.015 148);
      --surface: oklch(20% 0.018 148);
      --ink: oklch(95% 0.01 148);
      --ink-muted: oklch(74% 0.015 148);
      --line: oklch(30% 0.02 148);
      --accent: oklch(82% 0.08 148);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: clamp(2rem, 6vw, 4.5rem) 1.5rem 6rem;
    background: var(--ground);
    color: var(--ink);
    font-family: "Source Sans 3", -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 1.05rem;
    line-height: 1.6;
  }

  main { width: min(100%, 56rem); margin-inline: auto; display: flex; flex-direction: column; gap: 2.5rem; }

  .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.8rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin: 0;
  }

  .site-logo { width: 5.1rem; height: auto; display: block; margin-bottom: 1rem; }

  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-variation-settings: "SOFT" 34, "WONK" 1, "opsz" 60;
    font-size: clamp(2.1rem, 1.6rem + 2.4vw, 3.2rem);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin: 0.4rem 0 0;
    text-wrap: balance;
  }

  .motto { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.85rem; color: var(--ink-muted); margin: 0.6rem 0 0; }

  p { margin: 0; max-width: 64ch; }
  .muted { color: var(--ink-muted); }

  .designs { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(21rem, 100%), 1fr)); list-style: none; margin: 0; padding: 0; }

  .design {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    padding: 1.5rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
  }

  .design h2 {
    font-family: "Fraunces", Georgia, serif;
    font-variation-settings: "SOFT" 24, "WONK" 1, "opsz" 28;
    font-size: 1.35rem;
    letter-spacing: -0.02em;
    margin: 0;
  }

  .design p { font-size: 0.93rem; color: var(--ink-muted); }

  .swatches { display: flex; gap: 0.3rem; }
  .swatches span { width: 1.5rem; height: 1.5rem; border-radius: 5px; border: 1px solid var(--line); }

  .pages { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: auto; padding-top: 0.5rem; }

  .pages a {
    padding: 0.35rem 0.85rem;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.8rem;
    color: var(--accent);
    text-decoration: none;
    transition: border-color 160ms ease;
  }

  .pages a:hover { border-color: var(--accent); }

  .note {
    padding: 1.25rem 1.5rem;
    border: 1px dashed var(--line);
    border-radius: 14px;
    font-size: 0.93rem;
    color: var(--ink-muted);
  }

  code { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 0.88em; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
</style>
</head>
<body>
<main>
  <header>
    <img class="site-logo" src="assets/pop-logo.png" alt="Power of Play">
    <h1>Variants</h1>
  </header>

  <ul class="designs">
    <li class="design">
      <h2>Playroom</h2>
      <div class="swatches" aria-hidden="true">
        <span style="background:oklch(97.6% 0.022 142)"></span>
        <span style="background:oklch(89.8% 0.074 142)"></span>
        <span style="background:oklch(71% 0.128 142)"></span>
        <span style="background:oklch(29.5% 0.084 142)"></span>
        <span style="background:oklch(84% 0.105 92)"></span>
      </div>
      <div class="pages">
        <a href="variants/playroom/index.html">Home</a>
        <a href="variants/playroom/about.html">About</a>
        <a href="variants/playroom/contact.html">Contact</a>
        <a href="variants/playroom/components.html">Components</a>
      </div>
    </li>
    <li class="design">
      <h2>Playwell</h2>
      <div class="swatches" aria-hidden="true"><span style="background:#effaee"></span><span style="background:#bee1f4"></span><span style="background:#70bb6d"></span><span style="background:#123e20"></span></div>
      <div class="pages"><a href="variants/playwell/index.html">Home</a></div>
    </li>
    <li class="design">
      <h2>Potential</h2>
      <div class="swatches" aria-hidden="true"><span style="background:#f8fbf5"></span><span style="background:#dff0da"></span><span style="background:#b5dcb0"></span><span style="background:#173e20"></span><span style="background:#f4d589"></span></div>
      <div class="pages"><a href="variants/potential/index.html">Home</a></div>
    </li>
  </ul>

</main>
</body>
</html>
